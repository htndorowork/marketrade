        if (!text) return;
        e.preventDefault();
        text.slice(0, boxes.length).split('').forEach((ch, j) => { if (boxes[i + j]) boxes[i + j].value = ch; });
        const next = boxes[Math.min(i + text.length, boxes.length - 1)];
        next.focus();
      });
    });
    boxes[0]?.focus();

    function getCode() { return boxes.map(b => b.value).join(''); }

    // Saves the profile row (and any referral link) collected during sign-up — this
    // can only succeed now, once verifyOtp has given us a real, authenticated session.
    // Returns true if it actually saved a name, false if there was nothing to save
    // (e.g. the code was entered in a different browser/device than the one that
    // signed up, so the pending profile never made it here).
    async function finishPendingProfile() {
      const raw = localStorage.getItem('mt_pending_profile');
      if (!raw) return false;
      try {
        const { payload, refCode } = JSON.parse(raw);
        await supabase.from('profiles').upsert(payload);
        if (refCode) {
          const { data: referrer } = await supabase.from('profiles').select('id').eq('referral_code', refCode.toUpperCase()).maybeSingle();
          if (referrer && referrer.id !== payload.id) {
            await supabase.from('referrals').insert({ referrer_id: referrer.id, referred_id: payload.id });
          }
        }
        return true;
      } finally {
        localStorage.removeItem('mt_pending_profile');
      }
    }

    async function verifyCode() {
      err.style.color = '#1d4ed8'; err.textContent = '';
      const token = getCode();
      if (token.length !== 6) { err.textContent = '❌ Enter all 6 digits'; return; }
      const btn = document.getElementById('btn-verify');
      btn.textContent = 'Verifying...'; btn.disabled = true;
      const { error } = await supabase.auth.verifyOtp({ email, token, type: 'signup' });
      btn.textContent = 'Verify Code'; btn.disabled = false;
      if (error) { err.textContent = '❌ ' + error.message; return; }
      const saved = await finishPendingProfile();
      err.style.color = '#2e7d32';
      err.textContent = '✅ Verified! Taking you in...';
      if (saved) {
        setTimeout(() => location.href = '/', 1000);
        return;
      }
      // The sign-up details never made it here (localStorage from another browser/
      // device, cleared cache, etc.) — check whether this account still has no name
      // saved anywhere, and if so send them to finish their profile instead of
      // leaving it blank forever.
      const { data: { user } } = await supabase.auth.getUser();
      const { data: profile } = await supabase.from('profiles').select('full_name,whatsapp').eq('id', user.id).single();
      const needsProfile = !profile?.full_name?.trim() || !profile?.whatsapp?.trim();
      setTimeout(() => location.href = needsProfile ? 'profile?complete=1' : '/', 1000);
    }
    document.getElementById('btn-verify').onclick = verifyCode;
    boxes[boxes.length - 1].addEventListener('keydown', (e) => { if (e.key === 'Enter') verifyCode(); });

    window.resendCode = async () => {
      err.style.color = '#1d4ed8'; err.textContent = '';
      const link = document.getElementById('btn-resend');
      const { error } = await supabase.auth.resend({ type: 'signup', email });
      if (error) { err.textContent = '❌ ' + error.message; return; }
      err.style.color = '#2e7d32'; err.textContent = '✅ Code resent — check your email.';
      let secs = 30;
      link.style.pointerEvents = 'none'; link.style.opacity = '0.5';
      const label = link.textContent;
      const tick = setInterval(() => {
        link.textContent = 'Resend Code (' + secs + 's)';
        secs--;
        if (secs < 0) { clearInterval(tick); link.textContent = label; link.style.pointerEvents = 'auto'; link.style.opacity = '1'; }
      }, 1000);
    };
  </script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script>
</body>
</html>
