<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment received — Student Marketplace</title>
  <meta name="robots" content="noindex,nofollow"/>
  <link rel="canonical" href="https://www.mystudentmarketplace.com/payment-return.html"/>
  <meta name="description" content="Confirming your Student Marketplace order payment."/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#7c3aed"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png?v=2"/>
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico?v=2"/>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2"/>
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png?v=2"/>
  <link rel="stylesheet" href="style.css?v=1789517217"/>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-logo">Student<span>Marketplace</span> 🎓</a>
  </nav>
  <main class="auth-main">
    <div class="auth-card" style="text-align:center">
      <div id="pr-icon" style="font-size:48px;margin-bottom:12px">⏳</div>
      <h2 class="auth-title" id="pr-title">Confirming payment…</h2>
      <p class="auth-sub" id="pr-sub">Hang tight while we confirm this with TradeSafe.</p>
      <div id="pr-actions"></div>
    </div>
  </main>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const supabase = createClient('https://kqsqtasykdtpdrkqyaxp.supabase.co','sb_publishable_8S5WkeUpuQYSLWhIbUJr1w_VrwFatlZ');

    function setState(icon,title,sub,actionsHtml){
      document.getElementById('pr-icon').textContent=icon;
      document.getElementById('pr-title').textContent=title;
      document.getElementById('pr-sub').textContent=sub;
      document.getElementById('pr-actions').innerHTML=actionsHtml;
    }
    function orderErrorMessage(e){ return e?.message || 'Something went wrong — please try again.'; }

    async function run(){
      const raw = sessionStorage.getItem('smp_checkout_queue');
      if(!raw){
        // No queue on this device/tab (e.g. opened the return link separately,
        // or an older seller-plan payment) — just point them at their orders.
        setState('✅','Payment received','Your payment went through.',
          '<a href="profile.html?tab=orders" class="btn-primary" style="display:inline-block;margin-top:8px;text-decoration:none">View my orders</a>');
        return;
      }
      const q = JSON.parse(raw);
      q.idx = (q.idx||0) + 1; // the item we just paid for
      sessionStorage.setItem('smp_checkout_queue', JSON.stringify(q));

      if(q.idx >= q.items.length){
        sessionStorage.removeItem('smp_checkout_queue');
        // Whatever was paid for should no longer be sitting in the cart —
        // the pickup flow already clears it before the first redirect, but
        // a Pargo checkout doesn't, so clear it here once everything's paid.
        try{ localStorage.removeItem('cv_cart'); }catch(e){}
        setState('🎉','All paid!','Your order'+(q.items.length>1?'s are':' is')+' confirmed'+(q.delivery_method==='pickup'?" — you'll find your Collection PIN under My Orders.":' — TradeSafe is holding the payment until delivery is confirmed.'),
          '<a href="profile.html?tab=orders" class="btn-primary" style="display:inline-block;margin-top:8px;text-decoration:none">View my orders</a>');
        return;
      }

      // More items in the cart to pay for — create the next order and hand
      // off to TradeSafe's hosted checkout again.
      setState('⏳','Setting up your next payment…','Item '+(q.idx+1)+' of '+q.items.length+'.','');
      try{
        const item=q.items[q.idx];
        const {data,error}=await supabase.rpc('place_order_paid',{
          p_listing_id:item.listingId, p_quantity:item.qty,
          p_delivery_method:q.delivery_method,
          p_pargo_point_id:q.pargo_point_id, p_pargo_point_name:q.pargo_point_name
        });
        if(error) throw new Error(orderErrorMessage(error));
        const {data:fnData, error:fnError}=await supabase.functions.invoke('tradesafe-checkout',{body:{order_id:data.order_id}});
        if(fnError || !fnData?.checkout_url) throw new Error(fnData?.error||fnError?.message||'Could not start payment');
        window.location.href=fnData.checkout_url;
      }catch(e){
        setState('⚠️','That item didn\'t go through',orderErrorMessage(e),
          '<a href="profile.html?tab=orders" class="btn-primary" style="display:inline-block;margin-top:8px;text-decoration:none">View my orders</a>'+
          '<p style="margin-top:14px;font-size:12.5px;color:#888;font-weight:600">Earlier items in this order were paid successfully — only this one needs retrying, from its listing page.</p>');
      }
    }
    run();
  </script>
</body>
</html>
