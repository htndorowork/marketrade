<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Messages — Student Marketplace</title>
  <meta name="robots" content="noindex,nofollow"/>
  <link rel="canonical" href="https://www.mystudentmarketplace.com/messages.html"/>
  <meta name="description" content="Your conversations with buyers and sellers on Student Marketplace."/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#7c3aed"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png?v=2"/>
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico?v=2"/>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2"/>
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png?v=2"/>
  <link rel="stylesheet" href="style.css?v=1789517217"/>
  <style>
    .msg-wrap { max-width: 1400px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 320px 1fr; gap: 16px; height: calc(100vh - 90px); height: calc(100dvh - 90px); }
    @media (max-width: 700px) {
      .msg-wrap { grid-template-columns: 1fr; height: calc(100vh - 128px); height: calc(100dvh - 128px); }
      .msg-wrap .chat-panel { display: none; }
      .msg-wrap.chat-open .chat-panel { display: flex; }
      .msg-wrap.chat-open .thread-list { display: none; }
    }
    .chat-back-btn { display: none; background: none; border: none; cursor: pointer; font-size: 18px; font-weight: 900; color: #7c3aed; padding: 0 12px 0 0; font-family: inherit; }
    @media (max-width: 700px) { .chat-back-btn { display: inline-block; } }
    .thread-list { background: #fff; border: 2px solid #f0f0f0; border-radius: 16px; overflow: hidden; height: 100%; display: flex; flex-direction: column; }
    .thread-search-box { padding: 10px; border-bottom: 1px solid #f5f5f5; flex-shrink: 0; }
    .thread-search-box input { width: 100%; box-sizing: border-box; border: 2px solid #f0f0f0; border-radius: 50px; padding: 9px 14px; font-family: inherit; font-size: 13.5px; -webkit-appearance: none; }
    .thread-search-results { flex-shrink: 0; max-height: 240px; overflow-y: auto; border-bottom: 1px solid #f5f5f5; }
    .thread-search-result { padding: 10px 16px; border-bottom: 1px solid #f8f8f8; cursor: pointer; font-size: 13px; font-weight: 700; color: #333; }
    .thread-search-result:hover { background: #f5f0fe; }
    .thread-search-result small { display: block; font-size: 11px; font-weight: 600; color: #aaa; margin-top: 1px; }
    .thread-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .thread-item { padding: 12px 16px; border-bottom: 1px solid #f5f5f5; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .thread-item:hover, .thread-item.active { background: #f5f0fe; }
    .thread-avatar { width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 14px; background: #7c3aed; }
    .thread-info { min-width: 0; flex: 1; }
    .thread-name { font-weight: 800; font-size: 13.5px; color: #111; }
    .thread-preview { font-size: 12px; color: #888; font-weight: 600; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .thread-unread { display: inline-block; background: #7c3aed; color: #fff; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 50px; margin-left: 6px; }
    .chat-panel { background: #fff; border: 2px solid #f0f0f0; border-radius: 16px; display: flex; flex-direction: column; height: 100%; min-height: 0; }
    .chat-header { padding: 12px 16px; border-bottom: 2px solid #f5f5f5; display: flex; align-items: center; gap: 10px; position: relative; }
    .chat-avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 15px; background: #7c3aed; }
    .chat-header-info { flex: 1; min-width: 0; }
    .chat-header-name { font-weight: 800; font-size: 14px; color: #111; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-header-sub { font-size: 11.5px; color: #aaa; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-menu-btn { background: none; border: none; cursor: pointer; font-size: 20px; font-weight: 900; color: #888; padding: 4px 8px; font-family: inherit; line-height: 1; }
    .chat-options-dropdown { display: none; position: absolute; top: 54px; right: 10px; background: #fff; border: 2px solid #f0f0f0; border-radius: 14px; box-shadow: 0 12px 30px rgba(0,0,0,0.12); min-width: 210px; z-index: 20; overflow: hidden; }
    .chat-options-dropdown.open { display: block; }
    .chat-option-item { display: block; width: 100%; text-align: left; background: none; border: none; padding: 12px 16px; font-family: inherit; font-size: 13px; font-weight: 700; color: #333; cursor: pointer; border-bottom: 1px solid #f5f5f5; }
    .chat-option-item:last-child { border-bottom: none; }
    .chat-option-item:hover { background: #f8f8f8; }
    .chat-option-item.danger { color: #dc2626; }
    .chat-messages { flex: 1; padding: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 8px; }
    .bubble { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 13.5px; font-weight: 600; line-height: 1.4; }
    .bubble.me { align-self: flex-end; background: #7c3aed; color: #fff; border-bottom-right-radius: 4px; }
    .bubble.them { align-self: flex-start; background: #f5f5f5; color: #333; border-bottom-left-radius: 4px; }
    .bubble-time { font-size: 10px; opacity: 0.7; margin-top: 4px; display: flex; align-items: center; gap: 3px; justify-content: flex-end; }
    .bubble.them .bubble-time { justify-content: flex-start; }
    .bubble-tick { font-size: 11px; }
    .chat-input-row { display: flex; gap: 8px; padding: 12px; border-top: 2px solid #f5f5f5; align-items: center; }
    .chat-input-row input { flex: 1; border: 2px solid #f0f0f0; border-radius: 50px; padding: 10px 16px; font-family: inherit; font-size: 16px; -webkit-appearance: none; }
    .msg-wrap { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
    .chat-send-btn { background: #7c3aed; color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; font-family: inherit; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 17px; }
    .chat-send-btn:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-logo">Student<span>Marketplace</span> 🎓</a>
    <div class="nav-links nav-links-simple">
      <a href="index.html">Browse</a>
      <a href="profile.html" id="nav-profile">My Profile</a>
    </div>
  </nav>

  <div class="msg-wrap" id="msg-wrap">
    <div class="thread-list" id="thread-list">
      <div class="thread-search-box">
        <input type="text" id="user-search" placeholder="🔍 Search your conversations..." autocomplete="off"/>
      </div>
      <div class="thread-search-results" id="user-search-results" style="display:none"></div>
      <div class="thread-scroll" id="thread-scroll"><p class="loading-msg">Loading conversations... ⏳</p></div>
    </div>
    <div class="chat-panel" id="chat-panel">
      <div class="chat-header">
        <button class="chat-back-btn" onclick="closeThread()" aria-label="Back to conversations">←</button>
        <div class="chat-avatar" id="chat-avatar" style="display:none"></div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="chat-header-text">Select a conversation</div>
          <div class="chat-header-sub" id="chat-header-sub" style="display:none"></div>
        </div>
        <button class="chat-menu-btn" id="chat-menu-btn" style="display:none" onclick="toggleChatOptions()">⋮</button>
        <div class="chat-options-dropdown" id="chat-options-dropdown">
          <button class="chat-option-item" onclick="viewSellerProfile()">👤 View Seller Profile</button>
          <button class="chat-option-item danger" id="chat-option-block" onclick="toggleBlockThread()">🚫 Block User</button>
          <button class="chat-option-item danger" onclick="openReportUserModal()">🚩 Report User</button>
        </div>
      </div>
      <div class="chat-messages" id="chat-messages"><p class="loading-msg" style="margin:auto">Pick a conversation on the left, or message a seller from a listing 💬</p></div>
      <p id="blocked-notice" style="display:none;text-align:center;font-size:12.5px;color:#aaa;font-weight:700;padding:10px">🚫 You've blocked this user — unblock them to send a message.</p>
      <div class="chat-input-row" id="chat-input-row" style="display:none">
        <input type="text" id="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()"/>
        <button class="chat-send-btn" onclick="sendMessage()" aria-label="Send">➤</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="report-user-modal-overlay" onclick="closeReportUserModal()" style="display:none">
    <div class="modal" onclick="event.stopPropagation()" style="max-width:420px">
      <button class="modal-close" onclick="closeReportUserModal()">✕</button>
      <div style="padding:22px 20px">
        <div class="tb-heading">🚩 Report this user</div>
        <div class="form-group">
          <label>Reason</label>
          <select id="report-user-reason">
            <option>Scam or fraud</option>
            <option>Harassment or abuse</option>
            <option>Spam</option>
            <option>Inappropriate content</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Details (optional)</label>
          <textarea id="report-user-details" rows="3" placeholder="Tell us more..."></textarea>
        </div>
        <div class="form-error" id="report-user-error"></div>
        <button class="btn-primary" onclick="submitReportUser()">Submit Report</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const supabase = createClient('https://kqsqtasykdtpdrkqyaxp.supabase.co','sb_publishable_8S5WkeUpuQYSLWhIbUJr1w_VrwFatlZ');

    let currentUser=null, activeThread=null, pollTimer=null, blockedIds=new Set();

    const AVATAR_COLORS = ['#7c3aed','#2563eb','#059669','#d97706','#dc2626','#db2777','#0891b2','#65a30d'];
    function avatarInitial(name){ return ((name||'?').trim().charAt(0)||'?').toUpperCase(); }
    function avatarColor(name){
      let hash=0;
      const s=name||'U';
      for(let i=0;i<s.length;i++) hash = s.charCodeAt(i) + ((hash<<5)-hash);
      return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
    }

    const {data:{user}} = await supabase.auth.getUser();
    if(!user){ window.location.href='login.html'; }
    currentUser=user;

    async function loadBlockedUsers(){
      const {data} = await supabase.from('blocked_users').select('blocked_id').eq('blocker_id',user.id);
      blockedIds = new Set((data||[]).map(b=>b.blocked_id));
    }

    async function loadThreads(){
      const {data} = await supabase.from('messages').select('*,listings(title)').or('buyer_id.eq.'+user.id+',seller_id.eq.'+user.id).order('created_at',{ascending:false});
      const msgs = data||[];
      // Group into threads by buyer_id + seller_id + listing_id
      const threadMap = {};
      msgs.forEach(m=>{
        const key = m.buyer_id+'|'+m.seller_id+'|'+(m.listing_id||'none');
        if(!threadMap[key]) threadMap[key] = {buyer_id:m.buyer_id, seller_id:m.seller_id, listing_id:m.listing_id, listingTitle:m.listings?.title, messages:[]};
        threadMap[key].messages.push(m);
      });
      const threads = Object.values(threadMap);

      // Fetch counterpart names
      const counterpartIds = [...new Set(threads.map(t=>t.buyer_id===user.id?t.seller_id:t.buyer_id))];
      let names={};
      if(counterpartIds.length){
        const {data:profs} = await supabase.from('profiles').select('id,full_name,store_name').in('id',counterpartIds);
        (profs||[]).forEach(p=>{names[p.id]=p.store_name||p.full_name||'User';});
      }

      const list = document.getElementById('thread-scroll');
      if(!threads.length){ list.innerHTML='<p class="loading-msg">No conversations yet</p>'; return; }
      threads.sort((a,b)=>new Date(b.messages[0].created_at)-new Date(a.messages[0].created_at));
      list.innerHTML = threads.map((t,i)=>{
        const counterpartId = t.buyer_id===user.id?t.seller_id:t.buyer_id;
        const unread = t.messages.filter(m=>m.sender_id!==user.id && !m.is_read).length;
        return '<div class="thread-item" data-idx="'+i+'" onclick="openThread('+i+')">'+
          '<div class="thread-avatar" style="background:'+avatarColor(names[counterpartId])+'">'+avatarInitial(names[counterpartId])+'</div>'+
          '<div class="thread-info"><div class="thread-name">'+escapeHtml(names[counterpartId]||'User')+(unread?'<span class="thread-unread">'+unread+'</span>':'')+'</div></div>'+
          '</div>';
      }).join('');
      window._threads = threads;
      window._names = names;
    }

    window.openThreadFromSearch = (idx) => {
      document.getElementById('user-search-results').style.display='none';
      document.getElementById('user-search').value='';
      window.openThread(idx);
    };

    document.getElementById('user-search').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      const results = document.getElementById('user-search-results');
      if (!q) { results.style.display='none'; results.innerHTML=''; return; }
      const threads = window._threads||[];
      const names = window._names||{};
      const matches = threads
        .map((t,i)=>({idx:i, counterpartId: t.buyer_id===user.id?t.seller_id:t.buyer_id}))
        .filter(x=>(names[x.counterpartId]||'User').toLowerCase().includes(q));
      if (!matches.length) {
        results.innerHTML = '<div class="thread-search-result" style="cursor:default;color:#aaa">No conversations match</div>';
        results.style.display='block';
        return;
      }
      results.innerHTML = matches.map(x=>{
        const name = (names[x.counterpartId]||'User').replace(/</g,'&lt;');
        return '<div class="thread-search-result" onclick="openThreadFromSearch('+x.idx+')">'+name+'</div>';
      }).join('');
      results.style.display='block';
    });
    document.addEventListener('click',(e)=>{
      const box = document.querySelector('.thread-search-box');
      const results = document.getElementById('user-search-results');
      if (results.style.display==='block' && box && !box.contains(e.target) && !results.contains(e.target)) {
        results.style.display='none';
      }
    });

    window.openThread = async (idx) => {
      const t = window._threads[idx];
      activeThread = t;
      document.getElementById('msg-wrap').classList.add('chat-open');
      document.querySelectorAll('.thread-item').forEach(el=>el.classList.remove('active'));
      document.querySelector('.thread-item[data-idx="'+idx+'"]')?.classList.add('active');
      const counterpartId = t.buyer_id===user.id?t.seller_id:t.buyer_id;
      const name = window._names[counterpartId]||'User';
      setChatHeader(name, t.listingTitle);
      updateBlockUI(counterpartId);
      renderMessages();
      // Mark unread as read
      const unreadIds = t.messages.filter(m=>m.sender_id!==user.id && !m.is_read).map(m=>m.id);
      if(unreadIds.length) await supabase.from('messages').update({is_read:true}).in('id',unreadIds);
    };

    function setChatHeader(name, sub){
      document.getElementById('chat-header-text').textContent = name;
      const subEl = document.getElementById('chat-header-sub');
      if(sub){ subEl.textContent = sub; subEl.style.display='block'; } else { subEl.style.display='none'; }
      const avatar = document.getElementById('chat-avatar');
      avatar.textContent = avatarInitial(name);
      avatar.style.background = avatarColor(name);
      avatar.style.display = 'flex';
      document.getElementById('chat-menu-btn').style.display = 'inline-block';
      document.getElementById('chat-options-dropdown').classList.remove('open');
    }
    window.toggleChatOptions = () => {
      document.getElementById('chat-options-dropdown').classList.toggle('open');
    };
    document.addEventListener('click',(e)=>{
      const dd = document.getElementById('chat-options-dropdown');
      const btn = document.getElementById('chat-menu-btn');
      if(dd.classList.contains('open') && !dd.contains(e.target) && e.target!==btn){
        dd.classList.remove('open');
      }
    });
    window.viewSellerProfile = () => {
      if(!activeThread) return;
      const counterpartId = activeThread.buyer_id===user.id?activeThread.seller_id:activeThread.buyer_id;
      window.location.href = 'store.html?seller='+counterpartId;
    };

    function updateBlockUI(counterpartId){
      const isBlocked = blockedIds.has(counterpartId);
      const btn = document.getElementById('chat-option-block');
      btn.textContent = isBlocked ? '✅ Unblock User' : '🚫 Block User';
      document.getElementById('chat-input-row').style.display = isBlocked ? 'none' : 'flex';
      document.getElementById('blocked-notice').style.display = isBlocked ? 'block' : 'none';
    }

    window.toggleBlockThread = async () => {
      if(!activeThread) return;
      document.getElementById('chat-options-dropdown').classList.remove('open');
      const counterpartId = activeThread.buyer_id===user.id?activeThread.seller_id:activeThread.buyer_id;
      if(blockedIds.has(counterpartId)){
        if(!confirm('Unblock this user? They\'ll be able to message you again.')) return;
        await supabase.from('blocked_users').delete().eq('blocker_id',user.id).eq('blocked_id',counterpartId);
        blockedIds.delete(counterpartId);
      } else {
        if(!confirm('Block this user? They won\'t be able to message you anymore, and you won\'t see new messages from them.')) return;
        await supabase.from('blocked_users').insert({blocker_id:user.id, blocked_id:counterpartId});
        blockedIds.add(counterpartId);
      }
      updateBlockUI(counterpartId);
    };

    window.openReportUserModal = () => {
      document.getElementById('chat-options-dropdown').classList.remove('open');
      if(!activeThread) return;
      document.getElementById('report-user-error').textContent='';
      document.getElementById('report-user-details').value='';
      document.getElementById('report-user-modal-overlay').style.display='flex';
    };
    window.closeReportUserModal = () => {
      document.getElementById('report-user-modal-overlay').style.display='none';
    };
    window.submitReportUser = async () => {
      const err = document.getElementById('report-user-error');
      err.style.color='#9333ea'; err.textContent='';
      if(!activeThread){ err.textContent='❌ No conversation selected'; return; }
      const counterpartId = activeThread.buyer_id===user.id?activeThread.seller_id:activeThread.buyer_id;
      const {error} = await supabase.from('reports').insert({
        reporter_id: user.id,
        reported_user_id: counterpartId,
        listing_id: activeThread.listing_id||null,
        reason: document.getElementById('report-user-reason').value,
        details: document.getElementById('report-user-details').value.trim()||null
      });
      if(error){ err.textContent='❌ '+error.message; return; }
      err.style.color='#2e7d32'; err.textContent='✅ Report submitted. Thanks for helping keep the marketplace safe!';
      setTimeout(closeReportUserModal, 1800);
    };

    window.closeThread = () => {
      document.getElementById('msg-wrap').classList.remove('chat-open');
    };

    function escapeHtml(s){
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }
    function renderMessages(){
      const box = document.getElementById('chat-messages');
      const sorted = [...activeThread.messages].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
      box.innerHTML = sorted.map(m=>{
        const isMe = m.sender_id===user.id;
        const time = new Date(m.created_at).toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'});
        const ticks = isMe ? '<span class="bubble-tick">'+(m.is_read?'✓✓':'✓')+'</span>' : '';
        return '<div class="bubble '+(isMe?'me':'them')+'">'+escapeHtml(m.content)+
          '<div class="bubble-time">'+time+ticks+'</div></div>';
      }).join('');
      box.scrollTop = box.scrollHeight;
    }

    let isSending = false;
    window.sendMessage = async () => {
      if (isSending) return; // guards against double-tap / double-Enter firing this twice
      const input = document.getElementById('chat-input');
      const content = input.value.trim();
      if(!content || !activeThread) return;
      isSending = true;
      const sendBtn = document.querySelector('#chat-input-row button');
      if (sendBtn) sendBtn.disabled = true;
      input.value=''; // clear immediately so a repeated Enter/click can't resend the same text
      const payload = {
        buyer_id: activeThread.buyer_id, seller_id: activeThread.seller_id,
        listing_id: activeThread.listing_id, sender_id: user.id, content
      };
      try {
        const {data,error} = await supabase.from('messages').insert(payload).select().single();
        if(error){ alert('Could not send: '+error.message); input.value = content; return; }
        // Own realtime subscription will also receive this INSERT — addMessageOnce()
        // keeps that from rendering it a second time.
        addMessageOnce(activeThread, data);
        renderMessages();
      } finally {
        isSending = false;
        if (sendBtn) sendBtn.disabled = false;
      }
    };

    // Adds a message to a thread's list only if it isn't already there (by id),
    // since the sender's own INSERT is echoed back through their own realtime
    // subscription — without this, every message you send would render twice.
    function addMessageOnce(thread, m){
      if (thread.messages.some(x=>x.id===m.id)) return false;
      thread.messages.unshift(m);
      return true;
    }

    // Start a new thread from ?seller=&listing= (buyer messaging a seller) or
    // ?buyer=&listing= (seller messaging a buyer) — these need separate params
    // because a thread's buyer_id/seller_id roles are fixed, and the current
    // user could be initiating contact from either side.
    const params = new URLSearchParams(location.search);
    const toSeller = params.get('seller');
    const toBuyer = params.get('buyer');
    const listingId = params.get('listing');
    if (toSeller && toSeller!==user.id) {
      const {data:sellerProfile} = await supabase.from('profiles').select('full_name,store_name').eq('id',toSeller).single();
      activeThread = { buyer_id:user.id, seller_id:toSeller, listing_id:listingId||null, messages:[] };
      document.getElementById('msg-wrap').classList.add('chat-open');
      setChatHeader(sellerProfile?.store_name||sellerProfile?.full_name||'Seller', null);
      document.getElementById('chat-messages').innerHTML = '<p class="loading-msg" style="margin:auto">Say hi 👋</p>';
    } else if (toBuyer && toBuyer!==user.id) {
      const {data:buyerProfile} = await supabase.from('profiles').select('full_name').eq('id',toBuyer).single();
      activeThread = { buyer_id:toBuyer, seller_id:user.id, listing_id:listingId||null, messages:[] };
      document.getElementById('msg-wrap').classList.add('chat-open');
      setChatHeader(buyerProfile?.full_name||'Buyer', null);
      document.getElementById('chat-messages').innerHTML = '<p class="loading-msg" style="margin:auto">Say hi 👋</p>';
    }

    await loadBlockedUsers();
    await loadThreads();
    if (toSeller) updateBlockUI(toSeller);
    else if (toBuyer) updateBlockUI(toBuyer);
    // If we started a thread via URL params and it already exists, open the matching one instead of a blank one
    if (toSeller) {
      const idx = (window._threads||[]).findIndex(t=>t.seller_id===toSeller && t.buyer_id===user.id && (t.listing_id||null)===(listingId||null));
      if (idx>-1) window.openThread(idx);
    } else if (toBuyer) {
      const idx = (window._threads||[]).findIndex(t=>t.buyer_id===toBuyer && t.seller_id===user.id && (t.listing_id||null)===(listingId||null));
      if (idx>-1) window.openThread(idx);
    }

    // Realtime instead of polling: at scale, every open messages.html tab
    // polling every 10s multiplies DB load across all concurrent users for
    // no reason — a push-based subscription only does work when a message
    // actually arrives. Two channels: new messages involving me (insert
    // events), and my own blocked_users list (so a block/unblock from
    // another tab/device stays in sync too).
    supabase
      .channel('messages-for-'+user.id)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'buyer_id=eq.'+user.id},handleIncomingMessage)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'seller_id=eq.'+user.id},handleIncomingMessage)
      .subscribe();

    function handleIncomingMessage(payload){
      const m = payload.new;
      // If it's the currently-open thread, append it live without a full reload.
      if(activeThread && m.buyer_id===activeThread.buyer_id && m.seller_id===activeThread.seller_id && (m.listing_id||null)===(activeThread.listing_id||null)){
        if (addMessageOnce(activeThread, m)) renderMessages();
        if(m.sender_id!==user.id) supabase.from('messages').update({is_read:true}).eq('id',m.id);
      }
      // Refresh the thread list either way, to update previews/unread counts.
      loadThreads();
    }

    // Lightweight fallback: if the Realtime connection ever drops silently
    // (flaky network, tab backgrounded), this safety-net poll is much
    // slower than the old one (60s vs 10s) since it's only a backstop, not
    // the primary delivery mechanism anymore.
    pollTimer = setInterval(loadThreads, 60000);
  </script>
