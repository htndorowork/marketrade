<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Messages — Marketrade</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#2563eb"/>
  <link rel="icon" href="icons/icon-192.png"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .msg-wrap { max-width: 1400px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 320px 1fr; gap: 16px; height: calc(100vh - 90px); height: calc(100dvh - 90px); }
    @media (max-width: 700px) {
      .msg-wrap { grid-template-columns: 1fr; height: calc(100vh - 128px); height: calc(100dvh - 128px); }
      .msg-wrap .chat-panel { display: none; }
      .msg-wrap.chat-open .chat-panel { display: flex; }
      .msg-wrap.chat-open .thread-list { display: none; }
    }
    .chat-back-btn { display: none; background: none; border: none; cursor: pointer; font-size: 18px; font-weight: 900; color: #2563eb; padding: 0 12px 0 0; font-family: inherit; }
    @media (max-width: 700px) { .chat-back-btn { display: inline-block; } }
    .thread-list { background: #fff; border: 2px solid #f0f0f0; border-radius: 16px; overflow: hidden; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .thread-item { padding: 14px 16px; border-bottom: 1px solid #f5f5f5; cursor: pointer; }
    .thread-item:hover, .thread-item.active { background: #eff6ff; }
    .thread-name { font-weight: 800; font-size: 13.5px; color: #111; }
    .thread-preview { font-size: 12px; color: #888; font-weight: 600; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .thread-unread { display: inline-block; background: #2563eb; color: #fff; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 50px; margin-left: 6px; }
    .chat-panel { background: #fff; border: 2px solid #f0f0f0; border-radius: 16px; display: flex; flex-direction: column; height: 100%; min-height: 0; }
    .chat-header { padding: 14px 18px; border-bottom: 2px solid #f5f5f5; font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .chat-header #chat-header-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-header #chat-header-actions { flex-shrink: 0; }
    @media (max-width: 420px) {
      .chat-header #chat-header-text { flex-basis: 100%; white-space: normal; }
      .chat-header #chat-header-actions { font-size: 11px; }
    }
    .chat-messages { flex: 1; padding: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 8px; }
    .bubble { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 13.5px; font-weight: 600; line-height: 1.4; }
    .bubble.me { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
    .bubble.them { align-self: flex-start; background: #f5f5f5; color: #333; border-bottom-left-radius: 4px; }
    .bubble-time { font-size: 10px; opacity: 0.7; margin-top: 4px; }
    .chat-input-row { display: flex; gap: 8px; padding: 12px; border-top: 2px solid #f5f5f5; }
    .chat-input-row input { flex: 1; border: 2px solid #f0f0f0; border-radius: 50px; padding: 10px 16px; font-family: inherit; font-size: 16px; -webkit-appearance: none; }
    .msg-wrap { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
    .chat-input-row button { background: #2563eb; color: #fff; border: none; padding: 10px 20px; border-radius: 50px; font-family: inherit; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-logo">Market<span>rade</span> 🛍️</a>
    <div class="nav-links nav-links-simple">
      <a href="index.html">Browse</a>
      <a href="profile.html" id="nav-profile">My Profile</a>
    </div>
  </nav>

  <div class="msg-wrap" id="msg-wrap">
    <div class="thread-list" id="thread-list"><p class="loading-msg">Loading conversations... ⏳</p></div>
    <div class="chat-panel" id="chat-panel">
      <div class="chat-header"><button class="chat-back-btn" onclick="closeThread()" aria-label="Back to conversations">←</button><span id="chat-header-text" style="flex:1">Select a conversation</span><div id="chat-header-actions" style="display:none;gap:6px"><button class="btn-sm btn-toggle" id="mute-btn" onclick="toggleMute()">🔇 Mute</button><button class="btn-sm btn-delete" id="block-btn" onclick="toggleBlock()">🚫 Block</button></div></div>
      <div class="chat-messages" id="chat-messages"><p class="loading-msg" style="margin:auto">Pick a conversation on the left, or message a seller from a listing 💬</p></div>
      <div class="chat-input-row" id="chat-input-row" style="display:none">
        <input type="text" id="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()"/>
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const supabase = createClient('https://spupfdclswjlpwiebwlq.supabase.co','sb_publishable_EyDf6vx8F4-aI09u6lK0_w_F4gdi9PH');

    let currentUser=null, activeThread=null, pollTimer=null;
    let blockState={}; // counterpart_id -> {is_blocked, is_muted}

    const {data:{user}} = await supabase.auth.getUser();
    if(!user){ window.location.href='login.html'; }
    currentUser=user;

    async function loadBlockState(){
      const {data}=await supabase.from('blocked_users').select('*').eq('blocker_id',user.id);
      blockState={};
      (data||[]).forEach(r=>{ blockState[r.blocked_id]={is_blocked:r.is_blocked, is_muted:r.is_muted}; });
    }
    function updateHeaderActions(counterpartId){
      const st=blockState[counterpartId]||{is_blocked:false,is_muted:false};
      document.getElementById('chat-header-actions').style.display='flex';
      const muteBtn=document.getElementById('mute-btn');
      const blockBtn=document.getElementById('block-btn');
      muteBtn.textContent=st.is_muted?'🔔 Unmute':'🔇 Mute';
      blockBtn.textContent=st.is_blocked?'✅ Unblock':'🚫 Block';
    }
    window.toggleMute=async()=>{
      if(!activeThread)return;
      const counterpartId=activeThread.buyer_id===user.id?activeThread.seller_id:activeThread.buyer_id;
      const st=blockState[counterpartId]||{is_blocked:false,is_muted:false};
      const {error}=await supabase.from('blocked_users').upsert({blocker_id:user.id,blocked_id:counterpartId,is_blocked:st.is_blocked,is_muted:!st.is_muted},{onConflict:'blocker_id,blocked_id'});
      if(error){alert('Could not update: '+error.message);return;}
      await loadBlockState();
      updateHeaderActions(counterpartId);
    };
    window.toggleBlock=async()=>{
      if(!activeThread)return;
      const counterpartId=activeThread.buyer_id===user.id?activeThread.seller_id:activeThread.buyer_id;
      const st=blockState[counterpartId]||{is_blocked:false,is_muted:false};
      if(!st.is_blocked && !confirm('Block this user? They will no longer be able to message you.'))return;
      const {error}=await supabase.from('blocked_users').upsert({blocker_id:user.id,blocked_id:counterpartId,is_blocked:!st.is_blocked,is_muted:st.is_muted},{onConflict:'blocker_id,blocked_id'});
      if(error){alert('Could not update: '+error.message);return;}
      await loadBlockState();
      updateHeaderActions(counterpartId);
    };

    async function loadThreads(){
      const {data} = await supabase.from('messages').select('*,listings(title)').or('buyer_id.eq.'+user.id+',seller_id.eq.'+user.id).order('created_at',{ascending:false});
      const msgs = data||[];
      // Group into threads by buyer_id + seller_id + listing_id
      const threadMap = {};
      msgs.forEach(m=>{
        const key = m.buyer_id+'|'+m.seller_id+'|'+(m.listing_id||'none');
        if(!threadMap[key]) threadMap[key] = {buyer_id:m.buyer_id, seller_id:m.seller_id, listing_id:m.listing_id, listingTitle:m.listings?.title, messages:[]};
        threadMap[key].messages.push(m);
      });
      const threads = Object.values(threadMap);

      // Fetch counterpart names
      const counterpartIds = [...new Set(threads.map(t=>t.buyer_id===user.id?t.seller_id:t.buyer_id))];
      let names={};
      if(counterpartIds.length){
        const {data:profs} = await supabase.from('profiles').select('id,full_name,store_name').in('id',counterpartIds);
        (profs||[]).forEach(p=>{names[p.id]=p.store_name||p.full_name||'User';});
      }

      const list = document.getElementById('thread-list');
      if(!threads.length){ list.innerHTML='<p class="loading-msg">No conversations yet</p>'; return; }
      threads.sort((a,b)=>new Date(b.messages[0].created_at)-new Date(a.messages[0].created_at));
      list.innerHTML = threads.map((t,i)=>{
        const counterpartId = t.buyer_id===user.id?t.seller_id:t.buyer_id;
        const unread = t.messages.filter(m=>m.sender_id!==user.id && !m.is_read).length;
        return '<div class="thread-item" data-idx="'+i+'" onclick="openThread('+i+')">'+
          '<div class="thread-name">'+(names[counterpartId]||'User')+(unread?'<span class="thread-unread">'+unread+'</span>':'')+'</div>'+
          '</div>';
      }).join('');
      window._threads = threads;
      window._names = names;
    }

    window.openThread = async (idx) => {
      const t = window._threads[idx];
      activeThread = t;
      document.getElementById('msg-wrap').classList.add('chat-open');
      document.querySelectorAll('.thread-item').forEach(el=>el.classList.remove('active'));
      document.querySelector('.thread-item[data-idx="'+idx+'"]')?.classList.add('active');
      const counterpartId = t.buyer_id===user.id?t.seller_id:t.buyer_id;
      document.getElementById('chat-header-text').textContent = (window._names[counterpartId]||'User')+(t.listingTitle?' · '+t.listingTitle:'');
      document.getElementById('chat-input-row').style.display='flex';
      updateHeaderActions(counterpartId);
      renderMessages();
      // Mark unread as read
      const unreadIds = t.messages.filter(m=>m.sender_id!==user.id && !m.is_read).map(m=>m.id);
      if(unreadIds.length) await supabase.from('messages').update({is_read:true}).in('id',unreadIds);
    };

    window.closeThread = () => {
      document.getElementById('msg-wrap').classList.remove('chat-open');
    };

    function renderMessages(){
      const box = document.getElementById('chat-messages');
      const sorted = [...activeThread.messages].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
      box.innerHTML = sorted.map(m=>
        '<div class="bubble '+(m.sender_id===user.id?'me':'them')+'">'+m.content+
        '<div class="bubble-time">'+new Date(m.created_at).toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'})+'</div></div>'
      ).join('');
      box.scrollTop = box.scrollHeight;
    }

    window.sendMessage = async () => {
      const input = document.getElementById('chat-input');
      const content = input.value.trim();
      if(!content || !activeThread) return;
      const counterpartId = activeThread.buyer_id===user.id?activeThread.seller_id:activeThread.buyer_id;
      if(blockState[counterpartId]?.is_blocked){ alert('You have blocked this user. Unblock them to send a message.'); return; }
      const payload = {
        buyer_id: activeThread.buyer_id, seller_id: activeThread.seller_id,
        listing_id: activeThread.listing_id, sender_id: user.id, content
      };
      const {data,error} = await supabase.from('messages').insert(payload).select().single();
      if(error){ alert(error.message.includes('row-level security')?'Could not send — this user has blocked you.':'Could not send: '+error.message); return; }
      input.value='';
      activeThread.messages.unshift(data);
      renderMessages();
    };

    // Start a new thread from ?seller=&listing= params
    const params = new URLSearchParams(location.search);
    const toSeller = params.get('seller');
    const listingId = params.get('listing');
    await loadBlockState();
    if (toSeller && toSeller!==user.id) {
      const {data:sellerProfile} = await supabase.from('profiles').select('full_name,store_name').eq('id',toSeller).single();
      activeThread = { buyer_id:user.id, seller_id:toSeller, listing_id:listingId||null, messages:[] };
      document.getElementById('msg-wrap').classList.add('chat-open');
      document.getElementById('chat-header-text').textContent = sellerProfile?.store_name||sellerProfile?.full_name||'Seller';
      document.getElementById('chat-input-row').style.display='flex';
      document.getElementById('chat-messages').innerHTML = '<p class="loading-msg" style="margin:auto">Say hi 👋</p>';
      updateHeaderActions(toSeller);
    }

    await loadThreads();
    // If we started a thread via URL params and it already exists, open the matching one instead of a blank one
    if (toSeller) {
      const idx = (window._threads||[]).findIndex(t=>t.seller_id===toSeller && t.buyer_id===user.id && (t.listing_id||null)===(listingId||null));
      if (idx>-1) window.openThread(idx);
    }

    pollTimer = setInterval(loadThreads, 10000);
  </script>

    <a class="bottom-nav-item" href="profile.html"><span class="bottom-nav-icon">👤</span><span class="bottom-nav-label">Profile</span></a>
  </nav>

</body>
</html>
