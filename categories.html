<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>All Categories — Marketrade 🛒</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <meta property="og:title" content="All Categories — Marketrade 🛍️"/>
  <meta property="og:description" content="Browse every category on Marketrade."/>
  <meta property="og:type" content="website"/>
  <meta name="twitter:card" content="summary"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#2563eb"/>
  <link rel="icon" href="icons/icon-192.png"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .cat-page-wrap { max-width: 640px; margin: 0 auto; padding: 24px 20px 20px; }
    .cat-page-title { font-size: 22px; font-weight: 900; color: #111; margin-bottom: 14px; }
    .cat-search-bar { display: flex; background: #fff; border-radius: 50px; overflow: hidden; border: 2.5px solid #1e3a5f; box-shadow: 3px 3px 0 #1e3a5f; margin-bottom: 20px; }
    .cat-search-bar input { flex: 1; border: none; padding: 12px 20px; font-size: 16px; outline: none; color: #111; font-family: inherit; font-weight: 600; background: transparent; -webkit-appearance: none; }
    .cat-search-bar span { display: flex; align-items: center; padding: 0 18px; font-size: 16px; color: #2563eb; }
    .cat-list { background: #fff; border: 2px solid #f0f0f0; border-radius: 18px; overflow: hidden; }
    .cat-row { display: flex; align-items: center; gap: 12px; padding: 15px 18px; text-decoration: none; color: #111; border-bottom: 1px solid #f5f5f5; cursor: pointer; }
    .cat-row:last-child { border-bottom: none; }
    .cat-row:hover, .cat-row:active { background: #eff6ff; }
    .cat-row-emoji { font-size: 20px; width: 26px; text-align: center; flex-shrink: 0; }
    .cat-row-label { flex: 1; font-size: 14.5px; font-weight: 700; }
    .cat-row-chevron { color: #ccc; font-size: 16px; font-weight: 900; }
    .cat-empty { text-align: center; color: #aaa; font-weight: 700; padding: 30px 10px; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-logo">Market<span>rade</span> 🛍️</a>
    <div class="nav-links nav-links-simple">
      <a href="index.html">Browse</a>
      <a href="favorites.html" id="nav-favorites" style="display:none">❤️ Favorites</a>
      <a href="messages.html" id="nav-messages" style="display:none">💬 Messages<span class="inline-badge" id="msg-badge" style="display:none">0</span></a>
      <a href="profile.html" id="nav-profile" style="display:none">My Profile</a>
      <a href="login.html" id="nav-auth">Sign in</a>
    </div>
    <a href="index.html" class="nav-cart" title="Cart">🛒<span class="cart-badge" id="cart-badge" style="display:none">0</span></a>
  </nav>

  <div class="cat-page-wrap">
    <div class="cat-page-title">🗂️ All Categories</div>
    <div class="cat-search-bar">
      <input type="text" id="cat-search" placeholder="Search categories…" autocomplete="off" oninput="filterCats(this.value)"/>
      <span>🔍</span>
    </div>
    <div class="cat-list" id="cat-list"></div>
    <div class="cat-empty" id="cat-empty" style="display:none">No categories match your search 🤔</div>
  </div>

  <nav class="bottom-nav">
    <a class="bottom-nav-item" href="index.html"><span class="bottom-nav-icon">🔍</span><span class="bottom-nav-label">Browse</span></a>
    <a class="bottom-nav-item active" href="categories.html"><span class="bottom-nav-icon">🗂️</span><span class="bottom-nav-label">Categories</span></a>
    <a class="bottom-nav-item" href="messages.html" id="bnav-messages"><span class="bottom-nav-icon">💬</span><span class="bottom-nav-badge" id="bnav-msg-badge" style="display:none">0</span><span class="bottom-nav-label">Messages</span></a>
    <a class="bottom-nav-item" href="favorites.html"><span class="bottom-nav-icon">❤️</span><span class="bottom-nav-label">Favourites</span></a>
    <a class="bottom-nav-item" href="profile.html"><span class="bottom-nav-icon">👤</span><span class="bottom-nav-label">Profile</span></a>
  </nav>

  <script>
    const CATEGORIES = [
      {value:'Textbooks', label:'Textbooks', emoji:'📚'},
      {value:'Stationary', label:'Stationary', emoji:'✏️'},
      {value:'Electronics', label:'Electronics', emoji:'📱'},
      {value:'Clothing', label:'Clothing', emoji:'👗'},
      {value:'Beauty', label:'Beauty', emoji:'💄'},
      {value:'Jewellery', label:'Jewellery', emoji:'💍'},
      {value:'Bags', label:'Bags', emoji:'👜'},
      {value:'Food', label:'Food', emoji:'🍱'},
      {value:'Snacks', label:'Snacks', emoji:'🍿'},
      {value:'Utensils', label:'Utensils', emoji:'🍴'},
      {value:'Furniture', label:'Furniture', emoji:'🛋️'},
      {value:'Decor', label:'Home Decor', emoji:'🖼️'},
      {value:'Appliances', label:'Appliances', emoji:'🔌'},
      {value:'Tools', label:'Tools', emoji:'🔧'},
      {value:'Hardware', label:'Hardware', emoji:'🔨'},
      {value:'Gaming', label:'Gaming', emoji:'🎮'},
      {value:'Sports', label:'Sports & Outdoor', emoji:'🏃'},
      {value:'Toys', label:'Toys & Hobbies', emoji:'🧸'},
      {value:'Books', label:'Books & Media', emoji:'📖'},
      {value:'Music', label:'Music', emoji:'🎸'},
      {value:'Cameras', label:'Cameras', emoji:'📸'},
      {value:'Pets', label:'Pets', emoji:'🐾'},
      {value:'Baby', label:'Baby & Kids', emoji:'👶'},
      {value:'Plants', label:'Plants & Garden', emoji:'🌱'},
      {value:'Events', label:'Events & Party', emoji:'🎉'},
      {value:'Health', label:'Health & Wellness', emoji:'🩹'},
      {value:'Data', label:'Data & Airtime', emoji:'📶'},
      {value:'Career', label:'Career', emoji:'💼'},
      {value:'Transport', label:'Transport', emoji:'🚲'},
      {value:'Vehicles', label:'Vehicles', emoji:'🚗'},
      {value:'Accommodation', label:'Accommodation', emoji:'🏠'},
      {value:'Tutoring', label:'Tutoring', emoji:'🎓'},
      {value:'Services', label:'Services', emoji:'🛠️'},
      {value:'Others', label:'Others', emoji:'🔀'}
    ];

    function renderCats(list){
      const box=document.getElementById('cat-list');
      const empty=document.getElementById('cat-empty');
      if(!list.length){ box.style.display='none'; empty.style.display='block'; return; }
      box.style.display='block'; empty.style.display='none';
      box.innerHTML=list.map(c=>
        '<a class="cat-row" href="index.html?cat='+encodeURIComponent(c.value)+'">'+
          '<span class="cat-row-emoji">'+c.emoji+'</span>'+
          '<span class="cat-row-label">'+c.label+'</span>'+
          '<span class="cat-row-chevron">›</span>'+
        '</a>'
      ).join('');
    }
    window.filterCats=(q)=>{
      q=(q||'').trim().toLowerCase();
      renderCats(q ? CATEGORIES.filter(c=>c.label.toLowerCase().includes(q)) : CATEGORIES);
    };
    renderCats(CATEGORIES);
  </script>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const supabase = createClient('https://spupfdclswjlpwiebwlq.supabase.co','sb_publishable_EyDf6vx8F4-aI09u6lK0_w_F4gdi9PH');

    const {data:{user}}=await supabase.auth.getUser();
    if(user){
      document.getElementById('nav-auth').textContent='Sign out';
      document.getElementById('nav-auth').href='#';
      document.getElementById('nav-auth').onclick=async()=>{await supabase.auth.signOut();location.reload();};
      document.getElementById('nav-profile').style.display='inline';
      document.getElementById('nav-favorites').style.display='inline';
      document.getElementById('nav-messages').style.display='inline';
      const {data:p}=await supabase.from('profiles').select('role').eq('id',user.id).single();
      if(p?.role==='seller') document.getElementById('nav-profile').href='seller.html';
      supabase.from('messages').select('id',{count:'exact',head:true}).or('buyer_id.eq.'+user.id+',seller_id.eq.'+user.id).neq('sender_id',user.id).eq('is_read',false).then(({count})=>{
        if(count>0){
          const b=document.getElementById('msg-badge');b.textContent=count;b.style.display='inline-flex';
          const bb=document.getElementById('bnav-msg-badge');if(bb){bb.textContent=count;bb.style.display='flex';}
        }
      });
    }
  </script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script>
</body>
</html>
